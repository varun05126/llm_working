{% extends 'recommender/base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="error-page" style="text-align: center; padding: 4rem 1rem;">
  <span class="badge" style="margin-bottom: 1rem;">404 Error</span>
  <h1 style="margin-bottom: 1rem;">Page not found</h1>
  <p class="muted-text" style="max-width: 50ch; margin: 0 auto 2rem;">
    The page you are looking for does not exist or may have been moved.
  </p>
  <div class="btn-group" style="justify-content: center;">
    <a href="{% url 'home' %}" class="btn btn-primary">Return Home</a>
    <a href="{% url 'skill_assessment' %}" class="btn btn-secondary">Take an Assessment</a>
  </div>
</div>
{% endblock %}
