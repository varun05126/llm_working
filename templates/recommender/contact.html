{% extends 'recommender/base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<div class="contact-container">
  <h1>Contact Us</h1>
  <p class="lead">Have questions, feedback, or partnership inquiries? Get in touch with the SkillHer team.</p>

  <p class="muted-text">Direct email: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>

  <form method="post" action="{% url 'contact' %}">
    {% csrf_token %}

    <div class="form-group">
      <label for="id_name">Full Name</label>
      <input type="text" name="name" id="id_name" required value="{{ request.user.get_full_name|default:request.user.username }}">
    </div>

    <div class="form-group">
      <label for="id_email">Email Address</label>
      <input type="email" name="email" id="id_email" required value="{{ request.user.email }}">
    </div>

    <div class="form-group">
      <label for="id_category">Category</label>
      <select name="category" id="id_category">
        <option value="general">General Inquiry</option>
        <option value="technical">Technical Support</option>
        <option value="mentorship">Career Mentorship &amp; Partnerships</option>
        <option value="feedback">Platform Feedback &amp; Suggestions</option>
      </select>
    </div>

    <div class="form-group">
      <label for="id_subject">Subject</label>
      <input type="text" name="subject" id="id_subject" required placeholder="Brief description of your query">
    </div>

    <div class="form-group">
      <label for="id_message">Message</label>
      <textarea name="message" id="id_message" required rows="5" placeholder="How can we help?"></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Send message</button>
    </div>
  </form>
</div>
{% endblock %}
