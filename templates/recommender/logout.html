```html
{% extends 'recommender/base.html' %}

{% block title %}
Logout - SkillHer
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card text-center">

                    <!-- Logout Icon -->
                    <div class="auth-icon">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>

                    <!-- Heading -->
                    <h2>Logged Out Successfully!</h2>

                    <!-- Message -->
                    <p>
                        You have been safely logged out of your SkillHer account.
                    </p>

                    <p class="text-muted">
                        Thank you for using SkillHer. We hope to see you again!
                    </p>

                    <!-- Login Again -->
                    <div class="d-grid mt-4">

                        <a href="{% url 'login' %}"
                           class="btn btn-primary-skillher">

                            <i class="fas fa-sign-in-alt me-2"></i>
                            Login Again

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
```
