{% extends 'recommender/base.html' %}

{% block title %}
Logged Out - SkillHer
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="auth-card">
                    <div class="auth-icon">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                    <h2>You Have Been Logged Out</h2>
                    <p>Thank you for visiting SkillHer. You have successfully logged out of your account.</p>
                    <div class="d-grid">
                        <a href="{% url 'login' %}" class="btn btn-outline-skillher">
                            Log In Again
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-primary-skillher mt-3">
                            Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
