<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" aria-label="SkillHer Logo">
  <style>
    :root {
      --fg-color: #111111;
      --accent-color: #b83280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg-color: #f5f5f5;
        --accent-color: #f472b6;
      }
    }
    .base-line {
      stroke: var(--fg-color);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }
    .accent-line {
      stroke: var(--accent-color);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }
    .accent-fill {
      fill: var(--accent-color);
    }
    .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 33px;
      font-weight: 700;
      letter-spacing: -0.5px;
      dominant-baseline: middle;
    }
  </style>

  <g transform="translate(4, 0)">
    <!-- Hair Bun -->
    <circle cx="28" cy="11" r="5" class="accent-line" />
    <path d="M26 13 C23 15 22 18 22 22 C22 26 25 29 29 29 C34 29 37 25 37 21 C37 17 34 14 30 14" class="base-line" />
    
    <!-- Woman Profile Looking Down at Book -->
    <path d="M30 16 C34 18 36 21 35 24 C34 26 31 27 29 28" class="base-line" />
    <path d="M29 28 L28 34" class="base-line" />
    <!-- Shoulders Leaning Forward in Study -->
    <path d="M19 40 C22 35 25 34 28 34 C31 34 35 35 41 40" class="base-line" />

    <!-- Open Book Base & Pages -->
    <line x1="32" y1="41" x2="32" y2="54" class="base-line" />
    <path d="M32 41 C26 40 19 40 12 43 L12 53 C19 50 26 50 32 54" class="base-line" />
    <path d="M32 41 C38 40 45 40 52 43 L52 53 C45 50 38 50 32 54" class="base-line" />
    <path d="M32 41 C33 46 33 52 35 57 L38 54 L41 57 C40 53 39 47 38 43" class="accent-line" stroke-width="1.8" />
    <circle cx="39" cy="18" r="1.5" class="accent-fill" />
  </g>

  <!-- Wordmark -->
  <text x="74" y="34" class="wordmark">
    <tspan fill="var(--fg-color)">Skill</tspan><tspan fill="var(--accent-color)">Her</tspan>
  </text>
</svg>
